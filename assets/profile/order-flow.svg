<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="166" viewBox="0 0 1000 166" role="img" aria-labelledby="title">
<title id="title">Food Fight animated project card</title>
<style>

.track { animation: travel 4.8s linear infinite; stroke-dasharray: 24 346; }
.dot { animation: signal 4.8s ease-in-out infinite; }
@keyframes travel { to { stroke-dashoffset: -370; } }
@keyframes signal { 0%, 35%, 100% { opacity: .35; } 13% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g font-family="system-ui, Segoe UI, sans-serif">

<defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#201632"/><stop offset="1" stop-color="#131020"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="164" rx="22" fill="url(#card)" stroke="#5B4875"/>
<rect x="28" y="30" width="55" height="34" rx="9" fill="#FFCA8F"/>
<text x="55" y="53" text-anchor="middle" fill="#21162F" font-size="17" font-weight="800">01</text>
<text x="105" y="54" fill="#FFCA8F" font-size="15" font-weight="700" letter-spacing="1.8">MOBILE / DELIVERY</text>
<text x="28" y="105" fill="#FCF9FF" font-size="38" font-weight="790">Food Fight</text>
<text x="30" y="137" fill="#D8CCE9" font-size="18">Ordering, dispatch and COD settlement</text>
<path d="M562 99H914" stroke="#695780" stroke-width="2"/>
<path class="track" d="M562 99H914" stroke="#FFCA8F" stroke-width="3" stroke-linecap="round"/>
<circle cx="562" cy="99" r="8" fill="#181126" stroke="#FFCA8F"/><circle class="dot" style="animation-delay:0s" cx="562" cy="99" r="5" fill="#FFCA8F"/><text x="562" y="126" text-anchor="middle" fill="#E5DDF0" font-size="12" font-weight="650">CHECKOUT</text>
<circle cx="679" cy="99" r="8" fill="#181126" stroke="#FFCA8F"/><circle class="dot" style="animation-delay:1.15s" cx="679" cy="99" r="5" fill="#FFCA8F"/><text x="679" y="126" text-anchor="middle" fill="#E5DDF0" font-size="12" font-weight="650">KITCHEN</text>
<circle cx="796" cy="99" r="8" fill="#181126" stroke="#FFCA8F"/><circle class="dot" style="animation-delay:2.3s" cx="796" cy="99" r="5" fill="#FFCA8F"/><text x="796" y="126" text-anchor="middle" fill="#E5DDF0" font-size="12" font-weight="650">RIDER</text>
<circle cx="913" cy="99" r="8" fill="#181126" stroke="#FFCA8F"/><circle class="dot" style="animation-delay:3.4499999999999997s" cx="913" cy="99" r="5" fill="#FFCA8F"/><text x="913" y="126" text-anchor="middle" fill="#E5DDF0" font-size="12" font-weight="650">COD</text>

</g>
</svg>
