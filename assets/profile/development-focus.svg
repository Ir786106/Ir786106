<svg xmlns="http://www.w3.org/2000/svg" width="960" height="154" viewBox="0 0 960 154" role="img" aria-labelledby="title desc">
  <title id="title">Development focus</title>
  <desc id="desc">Three animated lanes represent Flutter and React Native, Firebase and FastAPI, and AI integration.</desc>
  <style>
    .beam { stroke-dasharray: 38 485; animation: move 4s linear infinite; }
    .b { animation-delay: -1.4s; } .c { animation-delay: -2.8s; }
    @keyframes move { to { stroke-dashoffset: -523; } }
    @media (prefers-reduced-motion: reduce) { .beam { animation: none; } }
  </style>
  <rect x="1" y="1" width="958" height="152" rx="20" fill="#10232F" stroke="#315563"/>
  <g font-family="system-ui, Segoe UI, sans-serif" fill="#E6F1F5" font-size="19" font-weight="650">
    <text x="44" y="43">01 / Mobile</text><text x="44" y="84">02 / Backend</text><text x="44" y="125">03 / Applied AI</text>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M245 36H651M245 77H651M245 118H651" stroke="#3E6270"/>
    <path class="beam" d="M245 36H651" stroke="#77E6C4"/>
    <path class="beam b" d="M245 77H651" stroke="#79D9FF"/>
    <path class="beam c" d="M245 118H651" stroke="#FFCD83"/>
  </g>
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="17" fill="#C9DCE4">
    <text x="680" y="42">Flutter / React Native</text>
    <text x="680" y="83">Firebase / FastAPI</text>
    <text x="680" y="124">LLM integrations</text>
  </g>
</svg>
