<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="title">
<title id="title">Animated development stack</title>
<style>

.lane { stroke-dasharray: 55 465; animation: carry 5s linear infinite; }
.lane.b { animation-delay: -1.65s; } .lane.c { animation-delay: -3.3s; }
