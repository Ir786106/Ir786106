<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" width="1200" height="365" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Irfan Waseem — Flutter and full-stack developer</title>
<desc id="desc">Dark, minimal developer banner with animated code orbit, technical grid and an introduction.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset=".55" stop-color="#101A2C"/><stop offset="1" stop-color="#14283B"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77F3DD"/><stop offset="1" stop-color="#8EB7FF"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#75E8DB" stop-opacity=".22"/><stop offset="1" stop-color="#75E8DB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8DB5C9" stroke-opacity=".095"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
<style>
.bob{animation:bob 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.pulse{animation:pulse 4s ease-in-out infinite}
.drift{animation:drift 9s linear infinite}
.enter{animation:enter .95s ease both}
.blink{animation:blink 1.2s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drift{0%{transform:translateX(-15px)}100%{transform:translateX(15px)}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect width="1200" height="365" rx="22" fill="url(#bg)"/>
<rect width="1200" height="365" rx="22" fill="url(#grid)"/>
<circle cx="971" cy="175" r="240" fill="url(#glow)"/>
<path d="M0 304C250 208 405 401 650 281S1020 272 1200 126" stroke="#9CDCCF" stroke-opacity=".16" fill="none" stroke-width="1.5"/>
<path d="M0 332C250 236 405 429 650 309S1020 300 1200 154" stroke="#9CDCCF" stroke-opacity=".08" fill="none" stroke-width="1.5"/>
<rect x="35" y="33" width="195" height="27" rx="13.5" fill="#152E3B" stroke="#3A827F" stroke-opacity=".7"/>
<circle cx="51" cy="46.5" r="4" fill="#76ECCA" class="pulse"/>
<text x="63" y="51" fill="#B4EDE0" font-size="12" letter-spacing="1.2" font-family="Arial, sans-serif" font-weight="700">OPEN TO BUILDING</text>
<g class="enter" font-family="Arial, Helvetica, sans-serif">
<text x="39" y="120" fill="#C6D8E4" font-size="20" letter-spacing="2.4">HELLO, I'M</text>
<text x="35" y="182" fill="#F5FAFF" font-size="59" font-weight="800" letter-spacing="-1.7">MUHAMMAD IRFAN</text>
<text x="35" y="244" fill="url(#neon)" font-size="65" font-weight="800" letter-spacing="-2.4">WASEEM</text>
<text x="40" y="289" fill="#BDD4E5" font-size="19">Flutter Developer  /  Full-Stack Builder  /  Security Learner</text>
<text x="40" y="330" fill="#829BB4" font-size="13" letter-spacing="1.7">COMSATS UNIVERSITY  ·  PAKISTAN  ·  CLASS OF 2027</text>
</g>
<g transform="translate(992 177)">
<circle r="119" fill="none" stroke="#64D6C8" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="4 10"/>
<circle r="93" fill="#14243A" stroke="#6DE4D4" stroke-opacity=".38" stroke-width="2"/>
<circle r="73" fill="none" stroke="#8AB9F7" stroke-opacity=".24" stroke-width="1.5"/>
<circle r="52" fill="#0D1C2B" stroke="#9AECDC" stroke-opacity=".5"/>
<g class="bob"><text x="0" y="17" fill="url(#neon)" font-family="monospace" text-anchor="middle" font-size="56" font-weight="700">&lt;/&gt;</text></g>
<g class="drift"><circle cx="0" cy="-93" r="7" fill="#74EDCC"/><circle cx="93" cy="0" r="5" fill="#8CB5FF"/><circle cx="-93" cy="0" r="4" fill="#74EDCC"/></g>
<path d="M0 -119 A119 119 0 0 1 119 0" fill="none" stroke="#79EBDD" stroke-opacity=".85" stroke-width="4" stroke-linecap="round" stroke-dasharray="45 760">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
</path></g>
<g font-family="monospace" font-size="13" fill="#B6D7E4" opacity=".83">
<rect x="783" y="71" width="114" height="37" rx="9" fill="#1A3042" stroke="#40697C"/><text x="797" y="95">{ Flutter }</text>
<rect x="1082" y="253" width="86" height="37" rx="9" fill="#1A3042" stroke="#40697C"/><text x="1095" y="277">Firebase</text>
<rect x="815" y="277" width="102" height="37" rx="9" fill="#1A3042" stroke="#40697C"/><text x="828" y="301">TypeScript</text>
</g>
</svg>